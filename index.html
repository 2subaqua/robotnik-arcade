const LEVELS = {

  space: [

    { patrol: true, splash: true, stage: 1, length: 2600, gap: [170, 280], waves: 3 },

/* ---- Basics ------------------------------------------------------------ */
const W = 480, H = 270, STEP = 1 / 60, TAU = Math.PI * 2;
const FONT = 'ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ";
const cv = document.getElementById("c"), ctx = cv.getContext("2d", { alpha: false });
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;
const pad5 = n => String(n).padStart(5, "0");
const hits = (p, r) => p.x >= r.x && p.y >= r.y && p.x < r.x + r.w && p.y < r.y + r.h;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function hsv(h, s, v) {
  h = mod(h, 1) * 6;
  const i = Math.floor(h), f = h - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
}
const css = (c, a = 1) => `rgba(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0},${a})`;
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);

/* ---- Saved data (per device) ------------------------------------------- */
const Save = (() => {
  let d = { hs: {}, mute: false, last: "MOS" };
  try { d = Object.assign(d, JSON.parse(localStorage.getItem("robotnik-arcade") || "{}")); } catch (e) {}
  return {
    d,
    write() { try { localStorage.setItem("robotnik-arcade", JSON.stringify(d)); } catch (e) {} },
    hs: id => d.hs[id] || { score: 0, name: "---" },
  };
})();

/* ---- Sound ------------------------------------------------------------- */
const Sound = {
  ac: null, master: null, buf: {}, live: {},
  // Original volume_db from the Godot scenes, as gain.
  vol: { hop: -6, gel: -8, boomChip: -4, boomArcade: -4, boomBaboom: -4, cheer: -2, victory: -7, defeat: -7, moontheme: -6, efire: -4, eboom: -3, bossfire: -4, bossengine: -6, mb_rocket: -9, mb_beep: -8, mb_fire: 0, mb_shoot: 4, mb_march1: -5, mb_march2: -5, mb_march3: -5, mb_march4: -5, mb_ufo: -3, mb_crash: -6, fall: -4, lift: -4, drop: -8, march1: -2, march2: -2, march3: -2, march4: -2, fire: -8, ufo: -6 },
  init(data) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = Save.d.mute ? 0 : 0.8;
    this.master.connect(this.ac.destination);
    for (const k in data) {
      const bin = atob(data[k]), u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      this.ac.decodeAudioData(u.buffer, b => { this.buf[k] = k === "bossengine" || k === "moontheme" ? b : this.trim(b); }, () => {});
    }
    setTimeout(() => { try { this.synth(); } catch (e) { console.error(e); } }, 60);
  },
  // A synthetic voice shouting "Yaayy!": a buzzing source shaped by three moving formants.
  yaay() {
    const sr = this.ac.sampleRate, n = Math.floor(0.85 * sr), b = this.ac.createBuffer(1, n, sr), c = b.getChannelData(0);
    const keys = [[0, 280, 2300, 3000], [0.14, 720, 1850, 2650], [0.62, 640, 1950, 2650], [1, 380, 2350, 2950]];
    const widths = [90, 130, 190], gains = [1, 0.65, 0.3], y1 = [0, 0, 0], y2 = [0, 0, 0];
    let ph = 0, peak = 0;
    for (let i = 0; i < n; i++) {
      const k = i / n, t = i / sr;
      const f0 = 230 + 190 * Math.min(1, k / 0.22) - 95 * Math.max(0, k - 0.4) / 0.6 + Math.sin(t * 34) * 7 * k;
      ph = (ph + f0 / sr) % 1;
      const src = ph * 2 - 1;
      let at = 0;
      while (at < keys.length - 2 && k > keys[at + 1][0]) at++;
      const a = keys[at], z = keys[at + 1], m = (k - a[0]) / (z[0] - a[0]);
      let out = 0;
      for (let f = 0; f < 3; f++) {
        const fr = a[f + 1] + (z[f + 1] - a[f + 1]) * m, r = Math.exp(-Math.PI * widths[f] / sr);
        const y = (1 - r) * src + 2 * r * Math.cos(TAU * fr / sr) * y1[f] - r * r * y2[f];
        y2[f] = y1[f]; y1[f] = y;
        out += y * gains[f];
      }
      c[i] = out * Math.min(1, k * 22) * Math.min(1, (1 - k) * 5);
      peak = Math.max(peak, Math.abs(c[i]));
    }
    // Radio treatment: overdrive, a narrow speaker band, crushed samples and a little static.
    const lowCut = 1 - Math.exp(-TAU * 450 / sr), highCut = 1 - Math.exp(-TAU * 2800 / sr);
    const holdFor = sr / 7500, steps = 14;
    let low = 0, high = 0, held = 0, nextHold = 0, top = 0;
    for (let i = 0; i < n; i++) {
      const x = Math.tanh(c[i] / peak * 3.5);
      low += (x - low) * lowCut; high += (x - high) * highCut;
      if (i >= nextHold) { held = Math.round((high - low) * steps) / steps; nextHold += holdFor; }
      const k = i / n;
      c[i] = held + (Math.random() - 0.5) * 0.14 * Math.min(1, k * 22) * Math.min(1, (1 - k) * 5);
      top = Math.max(top, Math.abs(c[i]));
    }
    for (let i = 0; i < n; i++) c[i] *= 0.85 / top;
    this.buf.yaay = b;
  },
  // Moonbase Defender's sounds come from a small model of an 80s sound chip:
  // raw square waves, a noise generator, 16 volume steps, new settings 50 times a second.
  // Nothing is smoothed, which is what makes it crisp.
  chip(name, frames, fn) {
    const sr = this.ac.sampleRate, per = Math.floor(sr / 50), n = frames * per;
    const b = this.ac.createBuffer(1, n, sr), c = b.getChannelData(0);
    const level = v => v <= 0 ? 0 : Math.pow(2, (Math.min(v, 15) - 15) / 2);
    const ph = [0, 0, 0];
    let np = 0, nv = 1, f = null;
    for (let i = 0; i < n; i++) {
      if (i % per === 0) f = fn(i / per, frames);
      let out = 0;
      (f.t || []).forEach(([hz, v], k) => { ph[k] = (ph[k] + hz / sr) % 1; out += (ph[k] < 0.5 ? 1 : -1) * level(v); });
      if (f.n) { np += f.n[0] / sr; if (np >= 1) { np %= 1; nv = Math.random() < 0.5 ? 1 : -1; } out += nv * level(f.n[1]); }
      c[i] = out * 0.3;
    }
    this.buf["mb_" + name] = b;
  },
  // Enemy explosions from the explosion lab: 1 chip pop, 4 arcade crackle, 5 ba-boom.
  explosions() {
    const sr = this.ac.sampleRate, make = (name, dur, fn) => {
      const n = Math.floor(dur * sr), b = this.ac.createBuffer(1, n, sr), c = b.getChannelData(0);
      let ph = 0, np = 0, nv = 1, peak = 0;
      const s = {
        noise: rate => { np += rate / sr; if (np >= 1) { np %= 1; nv = Math.random() < 0.5 ? 1 : -1; } return nv; },
        sq: f => { ph = (ph + f / sr) % 1; return ph < 0.5 ? 1 : -1; },
      };
      for (let i = 0; i < n; i++) { c[i] = Math.tanh(fn(i / sr, s)); peak = Math.max(peak, Math.abs(c[i])); }
      for (let i = 0; i < n; i++) c[i] *= 0.8 / peak * Math.min(1, (n - i) / (sr * 0.01));
      this.buf[name] = b;
    };
    make("boomChip", 0.5, (t, s) => {
      const hit = (t0, a) => { const u = t - t0; if (u < 0) return 0; return s.noise(16000 * Math.exp(-u * 5) + 2500) * a * Math.exp(-u * 9) + s.sq(900 * Math.exp(-u * 7) + 180) * 0.25 * a * Math.exp(-u * 14); };
      return hit(0, 0.8) + hit(0.09, 1);
    });
    make("boomArcade", 0.42, (t, s) => {
      const step = Math.min(7, Math.floor(t / 0.05));
      return s.noise(14000 - step * 1600) * Math.pow(2, -step);
    });
    make("boomBaboom", 0.6, (t, s) => {
      let v = 0;
      if (t < 0.07) v += s.noise(18000) * 0.75 * (1 - t / 0.07);
      const u = t - 0.1;
      if (u > 0) v += s.noise(7000 * Math.exp(-u * 3) + 2200) * Math.exp(-u * 6.5) + s.sq(320 * Math.exp(-u * 4) + 110) * 0.22 * Math.exp(-u * 8);
      return v;
    });
  },
  // A cheering crowd: a swelling roar of voices, "woo"s and lots of clapping.
  cheer() {
    const sr = this.ac.sampleRate, n = Math.floor(sr * 4.2), b = this.ac.createBuffer(1, n, sr), c = b.getChannelData(0);
    const voices = Array.from({ length: 26 }, () => ({ f: rnd(180, 420), ph: 0, start: rnd(0, 1.2), len: rnd(0.8, 2.4), rise: rnd(1.2, 1.8), vib: rnd(4, 7) }));
    const bands = [[700, 0.92], [1250, 0.93], [2500, 0.95]].map(([f, r]) => ({ a1: 2 * r * Math.cos(TAU * f / sr), a2: -r * r, y1: 0, y2: 0 }));
    const claps = new Float32Array(n);
    for (let k = 0; k < 160; k++) {
      const at = Math.floor(rnd(0.2, 3.9) * sr), a = rnd(0.3, 1), len = Math.floor(0.012 * sr);
      for (let j = 0; j < len && at + j < n; j++) claps[at + j] += (Math.random() * 2 - 1) * a * Math.exp(-j / sr * 420) * 0.9;
    }
    let peak = 0;
    for (let i = 0; i < n; i++) {
      const t = i / sr, env = Math.min(1, t / 0.5) * Math.min(1, (4.2 - t) / 1.2);
      let v = 0;
      for (const vo of voices) {
        const u = t - vo.start; if (u < 0 || u > vo.len) continue;
        const k = u / vo.len, f = vo.f * (1 + (vo.rise - 1) * Math.min(1, k * 3)) * (1 + Math.sin(u * vo.vib * TAU) * 0.02);
        vo.ph = (vo.ph + f / sr) % 1;
        v += (vo.ph * 2 - 1) * Math.sin(Math.PI * k) * 0.12;
      }
      let crowd = 0;
      const x = Math.random() * 2 - 1;
      for (const bd of bands) { const y = (1 - 0.93) * x + bd.a1 * bd.y1 + bd.a2 * bd.y2; bd.y2 = bd.y1; bd.y1 = y; crowd += y; }
      v = v * 0.5 + crowd * 1.6;
      v += claps[i];
      c[i] = Math.tanh(v * env * 1.4); peak = Math.max(peak, Math.abs(c[i]));
    }
    for (let i = 0; i < n; i++) c[i] *= 0.85 / peak;
    this.buf.cheer = b;
  },
  synth() {
    const C = (n, fr, fn) => this.chip(n, fr, fn);
    this.cheer();
    this.explosions();
    this.yaay();
    // Lucky tile: a bright shimmer when it appears, a triumphant run when it is taken.
    C("luckyup", 26, i => ({ t: [[1760 + (i % 4) * 660, 14 - i * 0.45], [3520 + (i % 3) * 880, 11 - i * 0.4]] }));
    C("luckygot", 42, i => { const m = [523, 659, 784, 1047, 1319, 1568, 2093][Math.min(6, Math.floor(i / 4))]; return { t: [[m, 15 - Math.max(0, i - 24) * 0.7], [m * 2, 12 - Math.max(0, i - 24) * 0.6], [m * 1.5, 9 - Math.max(0, i - 24) * 0.5]] }; });
    C("rocket", 16, i => ({ n: [2600 + (i % 4) * 320, 10], t: [[72 + (i % 2) * 6, 9]] }));
    C("beep", 13, i => ({ t: [[1568, i < 6 ? 13 : 0], [3136, i < 6 ? 8 : 0]] }));
    const notes = list => (i, n) => { const k = Math.floor(i / n * list.length), l = i / n * list.length - k; return { t: [[list[k], 14 - l * 7], [list[k] * 2, 10 - l * 6]] }; };
    C("shoot", 10, i => ({ t: [[5200 - i * 430, 12 - i], [2600 - i * 210, 15 - i*0.6]], n: [18000, 11 - i * 1.6] }));
    C("fire", 7, i => ({ t: [[2300 - i * 260, 12 - i]] }));
    [392, 349, 330, 294].forEach((hz, x) => C("march" + (x + 1), 4, i => ({ t: [[hz, 15 - i * 3], [hz * 4, 8 - i * 3]], n: [14000, 7 - i * 4] })));

/* ---- Screen ------------------------------------------------------------ */
/* Two layouts, shared by every game. All games draw in the same 480x270 world with the
   playing field at x 120-360 and their panels on either side:
   - landscape: the whole world fits the screen, touch controls sit in the side panels
   - portrait:  the field fills the width, a HUD strip (y -34 to 0) sits above it and
                the touch controls below it (y 272 and down); the side panels are off screen */
const HUD_H = 34, TOP_GAP = 18;
const View = {
  s: 1, ox: 0, oy: 0, dpr: 1, vw: 0, vh: 0, safeB: 0, portrait: false,
  resize() {
    const vw = this.vw = innerWidth, vh = this.vh = innerHeight;
    this.dpr = Math.min(devicePixelRatio || 1, 2.5);
    cv.width = Math.round(vw * this.dpr); cv.height = Math.round(vh * this.dpr);
    const r = document.getElementById("safe").getBoundingClientRect(), safeT = r.top;
    this.safeB = Math.max(vh - r.bottom, 0);
    this.portrait = vh > vw;
    if (this.portrait) {
      // TOP_GAP: an empty row above the score line, clear of the phone's status bar.
      this.s = Math.min(vw / 240, (vh - safeT - this.safeB) / (404 + TOP_GAP));
      this.ox = (vw - 240 * this.s) / 2 - 120 * this.s;
      this.oy = safeT + (HUD_H + TOP_GAP) * this.s;
    } else {
      this.s = Math.min(vw / W, vh / H);
      this.ox = (vw - W * this.s) / 2; this.oy = (vh - H * this.s) / 2;
    }
  },
  apply() {
    const k = this.s * this.dpr;
    ctx.setTransform(k, 0, 0, k, this.ox * this.dpr, this.oy * this.dpr);
    ctx.imageSmoothingEnabled = false;
  },
  toGame: (x, y) => ({ x: (x - View.ox) / View.s, y: (y - View.oy) / View.s }),
  get left() { return -this.ox / this.s; },
  get right() { return (this.vw - this.ox) / this.s; },
  get top() { return -this.oy / this.s; },
  get bottom() { return (this.vh - this.oy) / this.s; },
  get usableBottom() { return (this.vh - this.safeB - this.oy) / this.s; },
  fill(c) { rect(this.left, this.top, this.right - this.left, this.bottom - this.top, c); },
};
addEventListener("resize", () => View.resize());

function text(s, x, y, o = {}) {
  ctx.font = `${o.w || 700} ${o.size || 11}px ${FONT}`;
  ctx.textAlign = o.align || "center";
  ctx.textBaseline = "middle";
  if (o.outline) { ctx.lineJoin = "round"; ctx.lineWidth = 3; ctx.strokeStyle = o.outline; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || "#fff";
  ctx.fillText(s, x, y);
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function poly(pts, c) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  ctx.fillStyle = c; ctx.fill();
}

  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));

const Img = {};
function sprite(img, sx, sy, w, h, x, y, flip) {
  x = Math.round(x); y = Math.round(y);
  if (flip) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, sx, sy, w, h, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(img, sx, sy, w, h, x, y, w, h);

// A 16x16 frame drawn pointing up (the sheets point right), centered on x, y.
function turned16(img, sx, sy, x, y) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(-Math.PI / 2);
  ctx.drawImage(img, sx, sy, 16, 16, -8, -8, 16, 16); ctx.restore();

const tints = new Map();

  const key = img.src + color;

    const g = c.getContext("2d");

/* ---- Input: keyboard, gamepad, touch ------------------------------------ */
const ACTIONS = ["left", "right", "up", "down", "a", "b", "pause"];
const KEYS = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  Space: "a", Enter: "a", KeyZ: "a", Escape: ["b", "pause"],

const Input = {
  held: {}, just: {}, kb: {}, latch: {}, touch: {}, prev: {}, taps: [], typed: [], pointers: new Map(),
  touchMode: matchMedia("(pointer:coarse)").matches,
  readPad() {
    const out = {};
    let list = [];
    try { list = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) {}
    for (const p of list) {
      if (!p) continue;
      const b = i => p.buttons[i] && p.buttons[i].pressed, ax = p.axes;
      const std = p.mapping === "standard", hx = std ? 0 : ax[6] || 0, hy = std ? 0 : ax[7] || 0;
      if ((std && b(14)) || ax[0] < -0.5 || hx < -0.5) out.left = 1; if ((std && b(15)) || ax[0] > 0.5 || hx > 0.5) out.right = 1;
      if ((std && b(12)) || ax[1] < -0.5 || hy < -0.5) out.up = 1; if ((std && b(13)) || ax[1] > 0.5 || hy > 0.5) out.down = 1;
      if (b(0)) out.a = 1; if (b(1)) out.b = 1; if (b(std ? 9 : 7)) out.pause = 1;
    }
    return out;
  },
  update() {
    const pad = this.readPad();
    if (Object.keys(pad).length) Sound.wake();   // works only where the browser accepts a gamepad as a gesture
    for (const a of ACTIONS) {
      const now = !!(this.kb[a] || this.latch[a] || pad[a] || this.touch[a]);
      this.just[a] = now && !this.prev[a];
      this.held[a] = now; this.prev[a] = now;
      this.latch[a] = false;
    }
  },
};
const actionsOf = code => [].concat(KEYS[code] || []);
addEventListener("keydown", e => {
  Sound.wake();
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  Input.touchMode = false;
  // While entering a name, letter keys are letters and nothing else.
  if (scene.state === "name" && !paused && /^(Key|Digit)/.test(e.code)) { if (!e.repeat) Input.typed.push(e.key.toUpperCase()); e.preventDefault(); return; }
  // Play test: P and the level number (P4, P10 or P010) starts that level of the current or selected game.
  // Three digits start it at once; otherwise it starts a moment after the last digit.
  if (e.code === "KeyP") { Input.testAt = performance.now(); Input.testNum = ""; e.preventDefault(); return; }
  const dig = /^(?:Digit|Numpad)([0-9])$/.exec(e.code);
  if (dig && !e.repeat && performance.now() - (Input.testAt || -1e9) < 1500) {
    Input.testNum += dig[1]; Input.testAt = performance.now(); e.preventDefault();
    clearTimeout(Input.testTimer);
    const go = () => { const n = +Input.testNum; Input.testAt = 0; Input.testNum = ""; if (n > 0) testLevel(n - 1); };
    if (Input.testNum.length >= 3) go(); else Input.testTimer = setTimeout(go, 700);
    return;
  }
  if (e.code === "KeyM") { if (!e.repeat) Sound.toggle(); e.preventDefault(); return; }
  if (e.code === "KeyF") { if (!e.repeat) toggleFull(); e.preventDefault(); return; }
  if (e.key.length === 1 && !e.repeat) Input.typed.push(e.key.toUpperCase());
  const as = actionsOf(e.code);
  if (as.length) { e.preventDefault(); as.forEach(a => { Input.kb[a] = true; Input.latch[a] = true; }); }

addEventListener("keyup", e => actionsOf(e.code).forEach(a => { Input.kb[a] = false; }));
addEventListener("blur", () => { Input.kb = {}; });

cv.addEventListener("pointerdown", e => {
  e.preventDefault(); Sound.wake(); if (e.pointerType !== "touch") cv.focus({ preventScroll: true });
  if (e.pointerType === "touch") Input.touchMode = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const p = View.toGame(e.clientX, e.clientY);

cv.addEventListener("pointermove", e => { if (Input.pointers.has(e.pointerId)) Input.pointers.set(e.pointerId, View.toGame(e.clientX, e.clientY)); });
// iPhones only allow sound to start when a finger is lifted, not when it lands.
for (const t of ["touchend", "pointerup", "click"]) addEventListener(t, () => Sound.wake(), { passive: true });

cv.addEventListener("pointerup", lift);
cv.addEventListener("pointercancel", lift);
// Keep iOS from treating taps as text work: no selection, Copy menu, magnifier or double-tap zoom.
const noDefault = e => e.preventDefault();
for (const t of ["touchstart", "touchmove"]) document.addEventListener(t, noDefault, { passive: false });
for (const t of ["contextmenu", "selectstart", "dblclick", "gesturestart", "dragstart"]) document.addEventListener(t, noDefault, { passive: false });
document.addEventListener("selectionchange", () => { const g = getSelection(); if (g && g.rangeCount) g.removeAllRanges(); });

// One save slot, for when a game gets interrupted. Loading it empties the slot.
function saveGame() {
  const g = scene;
  Save.d.save = { id: g.id, title: g.title, level: g.level, score: g.score, lives: g.lives, levels: g.random ? g.levels : null, data: g.saveData() };
  Save.write();
}
function loadGame() {
  const d = Save.d.save, g = d.levels ? new Cheese(d.levels) : CARDS.find(c => c.id === d.id).make();
  g.level = d.level; g.score = d.score; g.lives = d.lives; g.jobs = []; g.msg = null;
  g.build(); g.loadData(d.data); g.ready();
  Save.d.save = null; Save.write();
  menu.sel = 0;
  go(g);
}

function testLevel(n) {
  const card = scene === menu ? CARDS[menu.sel] : CARDS.find(c => c.id === scene.id);
  const random = scene.random ? scene.levels : null;
  if (!(random || LEVELS[card.id])[n]) return;
  const g = random ? new Cheese(random) : card.make();
  g.level = n; g.jobs = []; g.msg = null; g.build(); g.ready();
  go(g);
}

function toggleFull() {
  try {
    const d = document;
    if (d.fullscreenElement) d.exitFullscreen();
    else { const p = d.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
  } catch (e) {}

/* ---- On-screen touch controls, in the side panels ----------------------- */
const Pads = {
  zone(side) {
    if (View.portrait) {
      const a = side < 0 ? 120 : 240, b = a + 120, top = 272, h = View.usableBottom - top, r = Math.min(52, h / 2 - 3, 56);
      return { x: (a + b) / 2, y: top + h / 2, r, a, b, top };
    }
    const a = side < 0 ? View.left : 362, b = side < 0 ? 118 : View.right, r = Math.min(52, (b - a) / 2 - 4);
    return { x: (a + b) / 2, y: 270 - r - 8, r, a, b, top: 150 };
  },
  // Cheese Chase: one large diamond, centered under the field (portrait)
  // or in the right panel (landscape, where the field fills the middle).
  diamond() {
    if (View.portrait) {
      const top = 272, h = View.usableBottom - top;
      return { x: 240, y: top + h / 2, a: 120, b: 360, top, hw: 56, hh: Math.max(16, (h - 8) / 4) };
    }
    const a = 362, b = View.right, top = 130, h = 264 - top;
    return { x: (a + b) / 2, y: top + h / 2, a, b, top, hw: Math.min(42, (b - a) / 4 - 2), hh: Math.min(32, (h - 6) / 4) };
  },
  // Landscape: the diamond is split, its left half in the left panel and its right half in the right panel,
  // each half two tiles on top of each other.
  halves() {
    const top = 130, h = 264 - top, y = top + h / 2;
    return [[-1, View.left, 118, [["left", 0.34], ["down", 0.13]]], [1, 362, View.right, [["up", 0.56], ["right", 0.86]]]].map(([side, a, b, tiles]) =>
      ({ side, a, b, top, x: (a + b) / 2, y, hw: Math.min(46, (b - a) / 2 - 4), hh: Math.min(30, (h - 8) / 4), tiles }));
  },
  readDiamond() {
    const t = {};
    if (!View.portrait) {
      for (const p of Input.pointers.values()) for (const z of this.halves())
        if (p.x >= z.a && p.x <= z.b && p.y >= z.top) t[z.tiles[p.y < z.y ? 0 : 1][0]] = true;
      return t;
    }
    const z = this.diamond();
    for (const p of Input.pointers.values()) {
      if (p.x < z.a || p.x > z.b || p.y < z.top) continue;
      const dx = p.x - z.x, dy = p.y - z.y;
      if (Math.hypot(dx, dy) < 6) continue;

  drawDiamond() {
    if (!View.portrait) {

class Cheese extends Game {

/* ---- Pause screen and main loop ----------------------------------------- */
const PBTN = [{ x: 180, y: 108, w: 120, h: 34, label: "Continue" }, { x: 180, y: 148, w: 120, h: 34, label: "Save" }, { x: 180, y: 188, w: 120, h: 34, label: "Menu" }];
let pauseSel = 0, pauseSaved = false;
function pauseAct(i) {
  if (i === 0) paused = false;
  else if (i === 2) go(menu);
  else if (scene.canSave) { saveGame(); pauseSaved = true; }
}
let scene = menu, paused = false, last = 0, acc = 0;
function go(s) {
  pauseSaved = false; Sound.stopAll(); Input.touch = {}; paused = false; scene = s;
  if (s !== menu && s.id === "space" && s.level === 0 && s.state === "ready") Sound.play("alarm");   // Space Attack only: start of a new game, during "Get ready!"
}

function tick() {
  Input.update();

  const free = taps.filter(p => !UI.tap(p));
  Input.taps = free;
  if (paused) {
    if (Input.just.up) pauseSel = mod(pauseSel - 1, 3);
    if (Input.just.down) pauseSel = mod(pauseSel + 1, 3);
    if (Input.just.a) pauseAct(pauseSel);
    else if (Input.just.b) go(menu);
    else if (Input.just.pause) paused = false;
    else for (const p of free) { const i = PBTN.findIndex(b => hits(p, b)); if (i >= 0) pauseAct(i); }
  } else if (scene !== menu && Input.just.pause) { paused = true; pauseSel = 0; pauseSaved = false; Sound.stopAll(); }
  else scene.update(STEP);
  Input.taps = [];
}
function render() {
  View.apply();
  scene.draw();
  if (paused) {
    View.fill("rgba(10,3,22,.75)");
    text("Paused", 240, 82, { size: 24, color: "#fff27f" });
    PBTN.forEach((b, i) => {
      const can = i !== 1 || scene.canSave, on = i === pauseSel;
      rounded(b.x, b.y, b.w, b.h, 7); ctx.fillStyle = on ? "#ffe066" : "#3a2763"; ctx.fill();
      text(i === 1 && pauseSaved ? "Saved" : b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, { size: 15, color: on ? "#22103a" : can ? "#fff" : "#7a6f96" });
    });
    if (!Input.touchMode) text("Up and down choose, Space selects, Esc goes to the menu", 240, 238, { size: 10, color: "#b3a7d2" });
  }
  UI.draw(paused);
}
function frame(now) {
  requestAnimationFrame(frame);
  if (innerWidth !== View.vw || innerHeight !== View.vh) View.resize();   // catches phone rotation
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  acc += dt;
  while (acc >= STEP) { tick(); acc -= STEP; }
  render();
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden && scene !== menu) { paused = true; pauseSel = 0; pauseSaved = false; Sound.stopAll(); }
});

// The Cheese Chase level editor opens the game as ...#test=<level as base64 JSON> to try a level.
function startFromHash() {
  const m = /^#test=(.+)$/.exec(location.hash);
  if (!m) return;
  try {
    const json = new TextDecoder().decode(Uint8Array.from(atob(m[1].replace(/-/g, "+").replace(/_/g, "/")), ch => ch.charCodeAt(0)));
    const lv = JSON.parse(json), g = new Cheese(Array.isArray(lv) ? lv : [lv]);
    g.test = true; go(g);
  } catch (e) { console.error(e); }
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
}
addEventListener("hashchange", startFromHash);
function boot(A) {
  View.resize();
  prepareMoonbase();
  try { Sound.init(A.snd); } catch (e) { console.error(e); }   // the game runs even if sound cannot start
  const names = Object.keys(A.img);
  let left = names.length;
  names.forEach(n => {
    const i = new Image();
    i.onload = i.onerror = () => { if (!--left) { startFromHash(); last = performance.now(); requestAnimationFrame(frame); } };
    i.src = "data:image/png;base64," + A.img[n];
    Img[n] = i;
  });
}
